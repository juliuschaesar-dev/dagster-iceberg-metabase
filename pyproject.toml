[project]
name = "dagster-iceberg-panel"
version = "0.1.0"
description = "REST Countries data pipeline: Dagster + Iceberg (Lakekeeper/Garage) + Trino + Panel"
requires-python = ">=3.11"
dependencies = [
    "dagster>=1.13",
    "dagster-webserver>=1.13",
    "requests>=2.34",
    "boto3>=1.43",
    "trino>=0.340",
    "pandas>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-mock>=3.15",
]
dashboard = [
    "panel>=1.9.4",
]

[tool.dagster]
module_name = "dagster_project"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dagster_project*", "panel_app*", "shared*"]
