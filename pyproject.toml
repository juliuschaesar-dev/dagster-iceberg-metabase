[project]
name = "dagster-iceberg-metabase"
version = "0.1.0"
description = "REST Countries data pipeline: Dagster + Iceberg (Lakekeeper/Garage) + Trino + Metabase"
requires-python = ">=3.10"
dependencies = [
    "dagster>=1.8",
    "dagster-webserver>=1.8",
    "requests>=2.31",
    "boto3>=1.34",
    "trino>=0.328",
    "polars>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[tool.dagster]
module_name = "dagster_project"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dagster_project*"]
